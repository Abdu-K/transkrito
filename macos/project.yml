# XcodeGen spec. On the Mac: `brew install xcodegen && xcodegen generate && open Transkrito.xcodeproj`
name: Transkrito
options:
  bundleIdPrefix: app.transkrito
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MACOSX_DEPLOYMENT_TARGET: "26.0"
targets:
  Transkrito:
    type: application
    platform: macOS
    sources:
      - path: Sources/Transkrito
        excludes: ["Resources"]
      - path: Sources/Transkrito/Resources
        type: folder
        buildPhase: resources
      - path: Assets/AppIcon.png
        buildPhase: resources
    info:
      path: Info.plist
    entitlements:
      path: Transkrito.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.transkrito.mac
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: NO
        OTHER_SWIFT_FLAGS: "-D XCODE_BUILD"
    dependencies:
      - sdk: Speech.framework
      - sdk: AVFoundation.framework
      - sdk: Carbon.framework
  TranskritoTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/TranskritoTests]
    dependencies:
      - target: Transkrito
